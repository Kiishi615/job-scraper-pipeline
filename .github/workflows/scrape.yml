name: Job Scraper Pipeline

on:
  schedule:
    # 7:30 AM WAT (6:30 UTC) — Nigeria + UK/EU morning posts
    - cron: '30 6 * * *'
    # 4:00 PM WAT (15:00 UTC) — US East Coast morning posts
    - cron: '0 15 * * *'
  workflow_dispatch:  # Manual trigger button in GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore persistent data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: scraper-data

      - name: Create data directory
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_docker.txt

      - name: Install Firefox for Playwright
        run: playwright install firefox --with-deps

      - name: Run pipeline
        env:
          TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp &
          sleep 2
          cp pipeline.docker.cfg pipeline.cfg
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s | %(name)s | %(levelname)s | %(message)s', handlers=[logging.FileHandler('data/pipeline.log'), logging.StreamHandler()])
          from main import run
          run()
          "

      - name: Save persistent data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: scraper-data-${{ github.run_id }}

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: data/pipeline.log
          retention-days: 7
